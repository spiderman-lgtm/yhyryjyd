<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SquadForge</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚒️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="login" class="login hidden">
    <form id="loginForm" class="login-card">
      <div class="logo big">⚒️ SquadForge</div>
      <p class="muted">The team lead's command center</p>
      <input type="email" id="email" placeholder="Email (for admins)" autocomplete="username" />
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required />
      <button class="btn gold" type="submit">Sign in</button>
      <p id="loginErr" class="err"></p>
    </form>
  </div>

  <header class="topbar">
    <div class="logo">⚒️ SquadForge</div>
    <div class="resources" id="resources"></div>
    <div class="top-right">
      <div class="integrations" id="integrations"></div>
      <button class="btn ghost small" id="logoutBtn" title="Logout">⎋</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="flow" class="active">🌊 Live Flow</button>
    <button data-tab="team" data-admin>📊 Dashboard</button>
    <button data-tab="village">🏰 Village</button>
    <button data-tab="requests" data-admin>📜 Requests</button>
    <button data-tab="reviews" data-admin>🔍 Reviews</button>
    <button data-tab="growth" data-admin>🌱 Growth</button>
    <button data-tab="reports" data-admin>🗞️ Reports</button>
    <button data-tab="commander" data-admin>⚔️ Commander</button>
    <button data-tab="integrations" data-admin>🔌 Integrations</button>
    <button data-tab="settings" data-admin>⚙️ Settings</button>
  </nav>

  <div id="banner"></div>
  <main id="view"></main>
  <div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
  <script src="/process.js"></script>
  <script src="/integrations.js"></script>
  <script src="https://flow.viasocket.com/connect.js" defer></script>
</body>
</html>
