<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#070b14;--a:#38bdf8;--b:#a78bfa;--c:#f472b6}
*{margin:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#fff;position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.55;animation:drift 14s ease-in-out infinite alternate}
.b1{width:900px;height:900px;left:-200px;top:-300px;background:var(--a)}
.b2{width:800px;height:800px;right:-200px;bottom:-300px;background:var(--b);animation-delay:-5s}
.b3{width:500px;height:500px;left:45%;top:35%;background:var(--c);opacity:.25;animation-delay:-9s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(120px,80px) scale(1.15)}}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:80px 80px;mask-image:radial-gradient(circle at 50% 50%,#000 20%,transparent 75%)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:28px}
.logo{display:flex;align-items:center;gap:22px;font-size:84px;font-weight:800;letter-spacing:-2px}
.logo .ring{width:92px;height:92px;border-radius:50%;border:8px solid var(--a);position:relative;box-shadow:0 0 60px rgba(56,189,248,.6)}
.logo .ring:after{content:"";position:absolute;inset:18px;border-radius:50%;background:var(--a);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:.7}50%{transform:scale(1.15);opacity:1}}
h1{font-size:112px;font-weight:800;letter-spacing:-4px;line-height:1.05;background:linear-gradient(90deg,#fff,#bae6fd 50%,#ddd6fe);-webkit-background-clip:text;color:transparent}
p{font-size:40px;color:#cbd5e1;font-weight:400}
.pills{display:flex;gap:18px;margin-top:10px}
.pill{padding:14px 30px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);backdrop-filter:blur(10px);font-size:30px;font-weight:600}
.url{position:absolute;bottom:70px;font-size:34px;color:#94a3b8;letter-spacing:1px}
.in{opacity:0;filter:blur(18px);transform:translateY(40px) scale(.96);animation:in 1.1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{to{opacity:1;filter:blur(0);transform:none}}
.d1{animation-delay:.2s}.d2{animation-delay:.55s}.d3{animation-delay:.9s}.d4{animation-delay:1.25s}.d5{animation-delay:1.6s}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grid"></div>
<div class="wrap" id="w"></div>
<script>
const kind=new URLSearchParams(location.search).get('k')||'intro';
const w=document.getElementById('w');
if(kind==='intro'){w.innerHTML=`
 <div class="logo in d1"><span class="ring"></span>DealRadar</div>
 <h1 class="in d2">Never overpay<br>online again</h1>
 <p class="in d3">Price tracking, comparison &amp; alerts for Indian shoppers</p>
 <div class="pills in d4"><span class="pill">24 Indian stores</span><span class="pill">Price history</span><span class="pill">Coupons</span><span class="pill">Email · WhatsApp · Telegram</span></div>
 <div class="url in d5">dealradar.embarko.app</div>`}
else{w.innerHTML=`
 <div class="logo in d1"><span class="ring"></span>DealRadar</div>
 <h1 class="in d2">Built with viaSocket.<br>Hosted on Embarko.</h1>
 <div class="pills in d3"><span class="pill">viaSocket · integrations &amp; automation</span><span class="pill">Embarko · one-command hosting</span></div>
 <p class="in d4">Web app · Browser extension · Telegram bot</p>
 <div class="url in d5">dealradar.embarko.app</div>`}
</script></body></html>
